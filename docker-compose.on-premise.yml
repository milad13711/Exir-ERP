# On-premise deployment bundle for a single dedicated-tenant Exir ERP
# instance, run entirely on the customer's own server with no dependency on
# our cloud infrastructure. See docs/ON_PREMISE.md for the full setup guide.
#
# Usage:
#   cp .env.on-premise.example .env
#   # fill in .env: a real POSTGRES_PASSWORD, JWT_SECRET, LICENSE_KEY,
#   # LICENSE_PUBLIC_KEY_PEM (given to you with the license), and the
#   # owner's name/phone.
#   docker compose -f docker-compose.on-premise.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: exir_control
    volumes:
      - exir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose — only reachable from other
    # containers on this compose network.

  backend:
    build:
      context: .
      dockerfile: apps/backend-core/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      CONTROL_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/exir_control?schema=public
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: 5432
      TENANT_DB_ADMIN_USER: postgres
      TENANT_DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN_SECONDS: 604800
      # devCode is only ever returned as a fallback when EXIR_SMS_API_KEY
      # below isn't set, or an actual send to exirsms.ir fails — see
      # docs/ON_PREMISE.md ("Known limitations") before exposing this
      # deployment to an untrusted network without EXIR_SMS_API_KEY set.
      OTP_DEV_ECHO: "true"
      EXIR_SMS_API_KEY: ${EXIR_SMS_API_KEY:-}
      EXIR_SMS_SENDER_LINE: ${EXIR_SMS_SENDER_LINE:-}
      DEPLOYMENT_MODE: ON_PREMISE
      LICENSE_KEY: ${LICENSE_KEY:?set LICENSE_KEY in .env — given to you when the license was issued}
      LICENSE_PUBLIC_KEY_PEM: ${LICENSE_PUBLIC_KEY_PEM:?set LICENSE_PUBLIC_KEY_PEM in .env — given to you when the license was issued}
      CONTROL_PLANE_CHECKIN_URL: ${CONTROL_PLANE_CHECKIN_URL:-}
      ON_PREM_ORG_NAME: ${ON_PREM_ORG_NAME:?set ON_PREM_ORG_NAME in .env}
      ON_PREM_ORG_SLUG: ${ON_PREM_ORG_SLUG:-local}
      ON_PREM_OWNER_NAME: ${ON_PREM_OWNER_NAME:?set ON_PREM_OWNER_NAME in .env}
      ON_PREM_OWNER_PHONE: ${ON_PREM_OWNER_PHONE:?set ON_PREM_OWNER_PHONE in .env}
      # The tenant web panel is same-origin behind nginx below and never
      # needs this. The admin console (internal tool, its own exposed port —
      # see the "admin" service) is a different origin, so its cross-origin
      # calls need to be allow-listed explicitly here.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BAHA24_API_KEY: ${BAHA24_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # بکاپ خارج از سایت (BackupService) — خالی یعنی غیرفعال، فقط بکاپ محلی.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      # Zarinpal — real online payment for invoices (see ZarinpalService).
      # Empty ZARINPAL_MERCHANT_ID means the gateway is simply unavailable
      # (public pay page shows "contact support" instead of a pay button).
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      # This container's own publicly-reachable URL, for building the
      # Zarinpal callback_url (Zarinpal redirects the customer's BROWSER
      # here, so it must be internet-reachable, not the docker-network name).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # Where the post-payment success page's "ورود" link points.
      WEB_PANEL_PUBLIC_URL: ${WEB_PANEL_PUBLIC_URL:-}
    volumes:
      # Daily automated backups (BackupService) land here — a host directory,
      # not the container's own filesystem, so they survive
      # `--force-recreate` on deploy instead of being discarded with it.
      - ./backups:/app/backups

  web:
    build:
      context: .
      dockerfile: apps/web-panel/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_TENANT_SLUG: ${ON_PREM_ORG_SLUG:-local}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server components under /shop (the public online-store storefront)
      # run inside this container and need the backend's internal
      # Docker-network address — same hairpin-NAT limitation already fixed
      # for the marketing site (see that service's identical comment below).
      API_URL_INTERNAL: http://backend:3001/api

  # Internal Exir team tool (tenant directory, subscriptions, support) — NOT
  # part of what a customer's on-premise install needs; only present here
  # because this particular server doubles as a shared-cloud control-plane
  # test environment. Talks to the backend over the public URL (not the
  # docker network) since it isn't proxied same-origin like "web" is —
  # requires CORS_ORIGINS above to include this service's own exposed URL.
  admin:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_API_URL: ${ADMIN_PANEL_API_URL:?set ADMIN_PANEL_API_URL in .env, e.g. http://<server-ip>:${EXPOSED_PORT:-80}/api}
        NEXT_PUBLIC_WEB_PANEL_URL: ${WEB_PANEL_PUBLIC_URL:-http://localhost:${EXPOSED_PORT:-80}}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_EXPOSED_PORT:-8081}:3000"

  # Public marketing/showcase site (industry templates + plan configurator +
  # lead capture) — its own origin, meant to eventually move to its own
  # subdomain (erp.eta.co.ir); exposed on its own port here in the meantime,
  # same pattern as "admin" above.
  marketing:
    build:
      context: .
      dockerfile: apps/marketing-site/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_API_URL: ${MARKETING_SITE_API_URL:?set MARKETING_SITE_API_URL in .env, e.g. http://<server-ip>:${EXPOSED_PORT:-80}/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-component fetches run inside this container and must use the
      # backend's internal Docker-network address — the container can't
      # reliably reach the host's own public IP:port back in (no hairpin
      # NAT here), which silently broke every page that couldn't be
      # pre-rendered at build time. Browser-side fetches (the /configure
      # wizard) still use the public NEXT_PUBLIC_API_URL above, baked in at
      # build time, since a browser can never resolve "backend".
      API_URL_INTERNAL: http://backend:3001/api
    ports:
      - "${MARKETING_EXPOSED_PORT:-8082}:3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "${EXPOSED_PORT:-80}:80"
    volumes:
      - ./infra/on-premise/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Optional support-access tunnel: joins this server to our own self-hosted
  # Headscale mesh (see infra/headscale/, docs/HEADSCALE.md) so Exir staff can
  # reach it for updates/troubleshooting without this server exposing any
  # inbound port of its own. Inert by default — only started with
  # `--profile remote-access`, and even then does nothing without a real
  # TS_AUTHKEY (issued per-deployment, see docs/HEADSCALE.md). Deliberately
  # NOT Tailscale's own hosted coordination server — see that doc for why
  # (avoids depending on a foreign company's infra to reach a customer's
  # private network).
  tailscale:
    image: tailscale/tailscale:latest
    container_name: exir-support-tunnel
    restart: unless-stopped
    profiles: ["remote-access"]
    hostname: ${ON_PREM_ORG_SLUG:-local}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Empty by default — deliberately NOT a required (":?") var: this
      # service sits behind the "remote-access" profile and is skipped
      # entirely on a normal `docker compose up`, but Compose still
      # interpolates every service's variables at parse time regardless of
      # profile, so a required-but-unset var here would break EVERY deploy,
      # not just ones that opt into this profile. Same "dormant without
      # config" pattern as EXIR_SMS_API_KEY/BAHA24_API_KEY elsewhere in this
      # file — set a real value in .env only when actually enabling this.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --login-server=${HEADSCALE_URL:-http://45.94.215.22:8083}
      TS_USERSPACE: "false"

volumes:
  exir_postgres_data:
