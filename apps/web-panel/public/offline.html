<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اتصال قطع است — اکسیر ERP</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: Tahoma, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 16px; background: #eef2ff; color: #4338ca;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 17px; margin: 0 0 8px; }
    p { font-size: 13.5px; color: #475569; line-height: 1.9; margin: 0; }
    button {
      margin-top: 20px; padding: 10px 20px; border: none; border-radius: 12px;
      background: #4338ca; color: white; font-family: inherit; font-size: 13.5px;
      font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12l9-9 9 9" /><path d="M5 10v10h14V10" /><path d="M9 20v-6h6v6" />
      </svg>
    </div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>این صفحه هنوز به‌صورت آفلاین ذخیره نشده. اطلاعاتی که قبلاً دیده‌اید همچنان در دسترس‌اند و هر تغییری که ثبت کنید، به‌محض اتصال مجدد ارسال می‌شود.</p>
    <button onclick="location.reload()">تلاش مجدد</button>
  </div>
</body>
</html>
