# Include INSIDE each server{} that proxies the Exir app (server level, applies to all locations that
# do not define their own limit_req):   include /etc/nginx/exir/rate-limit-server.conf;
# DRY-RUN tip: replace 'limit_req' with 'limit_req_dry_run on;' (nginx >= 1.17.1) to only log first:
#   limit_req_dry_run on;
limit_req zone=exir_auth   burst=15  nodelay;
limit_req zone=exir_public burst=40  nodelay;
limit_req zone=exir_api    burst=100 nodelay;
limit_conn exir_conn 100;
