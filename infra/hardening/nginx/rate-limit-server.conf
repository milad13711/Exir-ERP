# Include INSIDE each server{} that proxies the Exir app:   include /etc/nginx/exir/rate-limit-server.conf;
# Currently in DRY-RUN: violations are only LOGGED (nginx error.log: "limiting requests, dry run").
# Review:   grep "limiting requests, dry run" /var/log/nginx/error.log | awk '{print $13}' | sort | uniq -c | sort -rn | head
# To ENFORCE after reviewing a few days of logs: delete the limit_req_dry_run line and `nginx -t && systemctl reload nginx`.
limit_req_dry_run on;
limit_req zone=exir_auth   burst=30  nodelay;
limit_req zone=exir_public burst=40  nodelay;
limit_req zone=exir_api    burst=100 nodelay;
