# Two parts.
# PART A (http{} context) -> /etc/nginx/conf.d/exir-40-headers-map.conf
# X-Frame-Options value by path: SAMEORIGIN everywhere EXCEPT embeddable forms (/f/ and /embed/, and the
# public forms API they call). An EMPTY value makes add_header omit the header entirely -> frameable.
map $request_uri $exir_xfo {
    default            "SAMEORIGIN";
    ~^/f/              "";
    ~^/embed/          "";
    ~^/api/public/forms/ "";
}

# PART B (server{} context, include from every vhost): see security-headers-server.conf
