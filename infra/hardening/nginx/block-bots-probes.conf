# include inside server{} of hosts that are NOT WordPress/PHP (exirerp.ir, admin.exirerp.ir, app.eta.co.ir, ...).
# Do NOT include on a WordPress host (eta.co.ir if it still runs WP, wp-login would break).
# 444 = close connection without response (cheap). The exir-nginx-probe fail2ban jail bans repeats.
# Keep ACME challenges working: /.well-known/ is explicitly allowed first.
location ^~ /.well-known/acme-challenge/ { allow all; try_files $uri =404; }
location ~ /\.(?!well-known/) { return 444; }                       # .env .git .ssh .aws .DS_Store ...
location ~* ^/(wp-login\.php|wp-admin|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin|boaform|actuator|server-status|vendor/phpunit) { return 444; }
location ~* \.(?:php|asp|aspx|jsp|cgi|bak|sql|swp|old|orig|ini|log)$ { return 444; }
# Swagger/API docs: expose only to staff/VPN if desired (app serves /api/docs publicly today).
# location ^~ /api/docs { allow 127.0.0.1; allow OWNER_IP; deny all; proxy_pass http://127.0.0.1:8080; }
