# http{} context -> /etc/nginx/conf.d/exir-30-rate-limit.conf
# Design: ONE include per server block (rate-limit-server.conf). Zone keys come from `map`s, and an
# EMPTY key is never counted - so each zone only applies to its own URL prefix without per-location edits.
# Keys use $binary_remote_addr = real client IP once real-ip.conf is active.
# Sizing: real users behind shared NAT (offices, mobile CGNAT in Iran) share one IP -> generous bursts.

map $request_uri $exir_k_auth   { default ""; ~^/api/auth/   $binary_remote_addr; }
map $request_uri $exir_k_public { default ""; ~^/api/public/ $binary_remote_addr; }
map $request_uri $exir_k_api    { default ""; ~^/api/        $binary_remote_addr; }

# OTP / login: 20 req/min sustained per IP (a whole office logging in at 9am is covered by burst)
limit_req_zone $exir_k_auth   zone=exir_auth:10m   rate=20r/m;
# public booking / forms / store / events pages call these a lot (SPA polling): 10 r/s
limit_req_zone $exir_k_public zone=exir_public:10m rate=10r/s;
# authenticated API: 30 r/s per IP
limit_req_zone $exir_k_api    zone=exir_api:20m    rate=30r/s;

limit_conn_zone $binary_remote_addr zone=exir_conn:10m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
