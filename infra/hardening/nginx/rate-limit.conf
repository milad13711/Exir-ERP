# http{} context -> /etc/nginx/conf.d/exir-30-rate-limit.conf   (APPLIED on prod 2026-10-09 in DRY-RUN mode)
# Design: ONE include per server block (rate-limit-server.conf). Zone keys come from `map`s, and an
# EMPTY key is never counted - so each zone only applies to its own URL prefix without per-location edits.
# Keys use $binary_remote_addr = REAL client IP; this ONLY works because exir-real-ip.conf (ArvanCloud ranges) is active.
# NOTE: ~86% of traffic reaches the origin from ArvanCloud edge IPs - never enable per-IP limits/bans without real-ip.
#
# Only genuinely sensitive auth endpoints are limited. Limiting the whole /api/auth/ prefix would also hit
# /api/auth/2fa/status etc. and could 429 a whole office (shared NAT) logging in at 9am.
map $request_uri $exir_k_auth {
  default "";
  ~^/api/auth/otp/(request|verify|verify-totp|select-tenant)(\?|$) $binary_remote_addr;
  ~^/api/admin/auth/(login|login/totp|change-password)(\?|$)       $binary_remote_addr;
}
map $request_uri $exir_k_public { default ""; ~^/api/public/ $binary_remote_addr; }
map $request_uri $exir_k_api    { default ""; ~^/api/        $binary_remote_addr; }

limit_req_zone $exir_k_auth   zone=exir_auth:10m   rate=30r/m;
limit_req_zone $exir_k_public zone=exir_public:10m rate=10r/s;
limit_req_zone $exir_k_api    zone=exir_api:20m    rate=30r/s;

limit_req_status  429;
# must be >= the error_log level (default 'error') or dry-run/limit events are silently invisible
limit_req_log_level error;
