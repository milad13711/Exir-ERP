# http{} context -> /etc/nginx/conf.d/exir-20-real-ip.conf
# Makes $remote_addr the true client IP when the request arrives via a trusted CDN, so that
# rate limits and fail2ban act on users, never on CDN edges.
# SECURITY: only list ranges you truly trust; anyone inside those ranges can spoof the header.
# Because ONLY these ranges are trusted, direct requests to the origin can't forge X-Forwarded-For.
#
# Refresh ranges (run on the server, review the output, paste below, `nginx -t && nginx -s reload`):
#   ArvanCloud : curl -s https://www.arvancloud.ir/en/ips.txt          (also in panel: CDN > IP list)
#   Cloudflare : curl -s https://www.cloudflare.com/ips-v4 ; curl -s https://www.cloudflare.com/ips-v6
# Helper: ./refresh-cdn-ranges.sh prints ready-to-paste lines (does not write anything).
#
# Header: ArvanCloud sends the client IP in X-Forwarded-For (and ar-real-ip); Cloudflare uses CF-Connecting-IP.
# If one site is behind Arvan and another behind Cloudflare, use ONE header and verify with logs; default below is X-Forwarded-For.
real_ip_header X-Forwarded-For;
real_ip_recursive on;

