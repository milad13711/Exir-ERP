# EXAMPLE ONLY - do not drop in blindly. Compare with the real /etc/nginx/sites-enabled/app.eta.co.ir.
#
# Today the origin has only :80. Two safe options with ArvanCloud in front:
#  A) CDN SSL mode "Flexible" (browser<->CDN HTTPS, CDN<->origin HTTP): origin stays HTTP; traffic CDN->origin is
#     unencrypted over the internet. Acceptable-ish, but anyone able to hit the origin IP bypasses CDN.
#  B) CDN SSL mode "Full" (strict if the cert is valid): origin must serve HTTPS -> this file.
#
# Certificate issuance behind a CDN:
#   1) Easiest: DNS-01 (no CDN dependency):  certbot certonly --manual --preferred-challenges dns -d app.eta.co.ir
#      (or a DNS plugin if Arvan has one / acme.sh with Arvan API).
#   2) HTTP-01: works if the CDN forwards /.well-known/acme-challenge/ to the origin on :80 - set the CDN page-rule
#      "no cache / no redirect" for that path, or temporarily set the DNS record to "DNS only" (grey cloud).
#      certbot certonly --webroot -w /var/www/html -d app.eta.co.ir
#   Renewal is by certbot.timer; test:  certbot renew --dry-run
# Then optionally restrict origin :443/:80 to CDN ranges only (ufw allow from <range> to any port 443) so the
# origin cannot be hit directly - Arvan edge IPs are listed by nginx/refresh-cdn-ranges.sh.

upstream exir_app_origin { server 127.0.0.1:8080; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name app.eta.co.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    # Redirect only after the CDN is set to Full. With Flexible, a redirect here causes an infinite loop!
    # location / { return 301 https://$host$request_uri; }
    # until then keep the existing proxy config here (location / { proxy_pass ... }) 
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.eta.co.ir;

    ssl_certificate     /etc/letsencrypt/live/app.eta.co.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.eta.co.ir/privkey.pem;

    client_max_body_size 50m;       # match the existing vhost value
    include /etc/nginx/exir/security-headers-server.conf;
    include /etc/nginx/exir/hsts.conf;
    include /etc/nginx/exir/rate-limit-server.conf;
    include /etc/nginx/exir/block-bots-probes.conf;

    location /socket.io/ {
        proxy_pass http://exir_app_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr is already the real IP via real-ip.conf
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://exir_app_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
