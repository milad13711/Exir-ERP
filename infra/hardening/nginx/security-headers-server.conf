# include /etc/nginx/exir/security-headers-server.conf;  inside server{} (HTTP or HTTPS).
# GOTCHA: add_header in a nested location{} REPLACES all inherited add_header lines. If a location
# adds its own headers, re-include this file there.
# GOTCHA: if the upstream app already sends the same header you get duplicates; check with curl -sI.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(self), usb=(), interest-cohort=()" always;
# NOTE: camera=(self) because phone-camera event check-in uses it. Empty map value => header omitted.
add_header X-Frame-Options $exir_xfo always;

# CSP in REPORT-ONLY mode: nothing is blocked, violations are reported. Tighten after reviewing reports.
# Next.js needs 'unsafe-inline' (and often 'unsafe-eval' in dev). frame-ancestors is NOT honoured in
# report-only mode, so framing is controlled by X-Frame-Options above.
# Reporting endpoint: report-uri /csp-report must exist - either add to the vhost
#     location = /csp-report { access_log /var/log/nginx/csp-reports.log; return 204; }
# (and read the log), or point it at a service like report-uri.com / your own collector.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; report-uri /csp-report" always;
