# http{} context -> /etc/nginx/conf.d/exir-10-tls.conf
# NOTE: certbot's /etc/letsencrypt/options-ssl-nginx.conf (included in per-site blocks)
# sets its own protocols/ciphers; those take precedence inside those server blocks.
# Review it too (certbot >= 2.x already is TLS1.2+1.3 only).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;   # modern clients choose; recommended by Mozilla "intermediate"
ssl_session_timeout 1d;
ssl_session_cache shared:EXIR_SSL:10m;
ssl_session_tickets off;
# OCSP stapling: harmless but a no-op for Let's Encrypt certs (LE ended OCSP in 2025);
# nginx may log "ssl_stapling ignored, no OCSP responder URL" - expected, not an error.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
resolver_timeout 5s;
