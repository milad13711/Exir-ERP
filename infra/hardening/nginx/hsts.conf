# include ONLY inside TLS server blocks (listen 443 ssl). Never on :80 blocks, never on a domain
# that cannot serve HTTPS (a bad HSTS is cached by browsers for max-age!).
# Start with a short max-age (below), raise to 31536000 after a week of no problems.
# Do NOT add 'preload' unless you intentionally submit the domain to hstspreload.org (practically irreversible).
# CDN note: if ArvanCloud terminates TLS for the browser, the CDN may already add HSTS; avoid double headers.
add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
