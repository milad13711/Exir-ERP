# Include inside every public `server { ... }` block of the host nginx (before `location /`):
#     include /etc/nginx/snippets/exir-block-internal.conf;
# The backend also rejects proxied requests (X-Real-IP/X-Forwarded-For present) and needs INTERNAL_ALERT_TOKEN,
# but the endpoint has no business being reachable from the internet at all - defence in depth.
location ^~ /api/internal/ { return 404; }
