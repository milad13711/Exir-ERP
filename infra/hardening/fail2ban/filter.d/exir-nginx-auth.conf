# Repeated 401/403 on auth + public API paths. Default nginx "combined" log format.
# Test:
#   fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/exir-nginx-auth.conf
#   echo '1.2.3.4 - - [08/Oct/2026:10:00:00 +0000] "POST /api/auth/login HTTP/1.1" 401 52 "-" "curl"' > /tmp/t.log
#   fail2ban-regex /tmp/t.log exir-nginx-auth   # expect 1 matched
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "(?:POST|PUT|PATCH) /api/(?:auth|public)/\S* HTTP/[\d.]+" (?:401|403) .*$
ignoreregex =
