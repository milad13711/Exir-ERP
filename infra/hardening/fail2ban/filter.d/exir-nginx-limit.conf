# Clients repeatedly hitting rate limits (429 from rate-limit.conf).
# Test: echo '1.2.3.4 - - [08/Oct/2026:10:00:00 +0000] "GET /api/public/x HTTP/1.1" 429 10 "-" "ua"' > /tmp/t.log
#       fail2ban-regex /tmp/t.log exir-nginx-limit   # expect 1 matched
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ \S* HTTP/[\d.]+" 429 .*$
ignoreregex =
