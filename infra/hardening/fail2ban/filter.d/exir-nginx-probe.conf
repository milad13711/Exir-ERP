# Bot probes: dotfiles, phpmyadmin, cgi-bin, etc. (typically 404/444/403).
# NOTE: wp-login/wp-admin are intentionally NOT matched: eta.co.ir may host WordPress and legit admins would be banned.
# Mirrors nginx/block-bots-probes.conf. 444 appears as status 444 in the log.
# Test: echo '1.2.3.4 - - [08/Oct/2026:10:00:00 +0000] "GET /.env HTTP/1.1" 444 0 "-" "ua"' > /tmp/t.log
#       fail2ban-regex /tmp/t.log exir-nginx-probe   # expect 1 matched
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ /(?:\.env\S*|\.git\S*|\.aws\S*|\.ssh\S*|phpmyadmin\S*|pma\S*|vendor/phpunit\S*|cgi-bin/\S*|boaform\S*|actuator\S*|\.DS_Store|config\.json|server-status\S*) HTTP/[\d.]+" \d+ .*$
ignoreregex =
