# Standalone Headscale deployment for Exir ERP's remote-access mesh.
# Lives at /opt/headscale on the production host, independent of the app's
# own docker-compose.on-premise.yml (different lifecycle — this shouldn't be
# touched by an app deploy). See docs/HEADSCALE.md.

services:
  headscale:
    image: headscale/headscale:0.23.0
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - ./data:/var/lib/headscale
    ports:
      - "8083:8080"
    # No healthcheck: this image is distroless-minimal (no wget/curl/nc/sh —
    # confirmed by exec'ing in), so there's no tool available inside the
    # container to run one. `docker ps` will always show this as having no
    # health status, which is fine — nothing else depends on it being
    # healthy (no other service uses condition: service_healthy on this).
